name: CI

on:
  push:
    branches: [main, 'scratch/**']

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'haoxdong/marquee-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: bash .github/ci.sh
